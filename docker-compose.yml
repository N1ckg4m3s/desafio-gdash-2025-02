services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: ["bash", "-c", "
        mongod --replSet rs0 --bind_ip_all &
        sleep 5 &&
        mongosh --eval 'rs.initiate()' ||
        true &&
        wait
      "]

    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-service:
    build:
      context: ./python-service
    container_name: python-service
    command: python -u main.py
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      nest-api:
        condition: service_healthy
      go-worker:
        condition: service_started

  go-worker:
    build:
      context: ./go-worker
    container_name: go-worker
    command: ./worker
    depends_on:
      redis:
        condition: service_healthy

  nest-api:
    build:
      context: ./nest-api
      dockerfile: ${DOCKERFILE}
    volumes:
      - ./nest-api:/app
      - /app/node_modules
    env_file:
      - ./nest-api/.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"] 
      interval: 5s
      retries: 5
    depends_on:
      mongo:
        condition: service_healthy

  react-dashboard:
    build:
      context: ./react-dashboard
      dockerfile: ${DOCKERFILE}
    container_name: react-dashboard
    ports:
      - "8080:80"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      nest-api:
        condition: service_started

volumes:
  mongo-data:
  redis-data: